function fill(s, t) { return s.split('{n}').join(N || t.generic).split('{b}').join(N || '______'); }

function render() {
  var t = T[LANG];
  document.getElementById('btn-zh').className = LANG==='zh' ? 'on' : '';
  document.getElementById('btn-en').className = LANG==='en' ? 'on' : '';
  document.getElementById('h1').textContent = t.h1;
  document.getElementById('sub').innerHTML = N ? t.sub_n.split('{n}').join(N) : t.sub_g;
  document.getElementById('tips-title').textContent = t.tipsTitle;
  document.getElementById('tiplist').innerHTML = t.tips.map(function(x){return '<li>'+fill(x, t)+'</li>';}).join('');
  document.getElementById('samples-title').textContent = t.samplesTitle;
  document.getElementById('shuffle').textContent = t.shuffle;
  document.getElementById('photo').textContent = t.photo;
  document.getElementById('cta').textContent = fill(N ? t.cta_n : t.cta_g, t);
  var c2=document.getElementById('cta2'); if(c2){c2.textContent=document.getElementById('cta').textContent;}
  document.getElementById('foot').textContent = fill(N ? t.foot_n : t.foot_g, t);
  renderSamples();
}

function renderSamples() {
  var t = T[LANG];
  var pool = t.samples.slice();
  var pick = [];
  while (pick.length < 2 && pool.length) {
    pick.push(pool.splice(Math.floor(Math.random()*pool.length), 1)[0]);
  }
  document.getElementById('samplelist').innerHTML = pick.map(function(s){
    var body = fill(s, t);
    var tag = t.stylistTag + (N || '______');
    var full = body + '\n————\n' + tag;
    var displayHtml = body + '<span class="stylistline">————<br>' + tag + '</span>';
    var hint = (!N && t.copyhintBlank) ? t.copyhintBlank : t.copyhint;
    return '<div class="sample" data-txt="'+full.split('"').join('&quot;')+'">'+displayHtml+'<span class="copyhint">'+hint+'</span></div>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.sample'), function(el){
    el.onclick = function(){ copyText(el.getAttribute('data-txt')); };
  });
}

function copyText(s) {
  function done(){ toast(T[LANG].copied); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(s).then(done).catch(function(){ fallback(s); done(); });
  } else { fallback(s); done(); }
}
function fallback(s) {
  var ta = document.createElement('textarea');
  ta.value = s; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}
var toastTimer;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.style.opacity = 0; }, 1800);
}
function setLang(l) { LANG = l; render(); }
render();
['cta','cta2'].forEach(function(id){

      fbq('trackCustom','ReviewSubmitClick',{source:'review_page_'+id});
    }
  });
});
